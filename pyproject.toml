[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toriel-rl"
version = "0.1.0"
description = "A reproducible reinforcement learning environment for dodging Toriel-inspired attacks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=1.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
render = ["pygame-ce>=2.5"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]